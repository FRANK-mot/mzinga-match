<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Mzinga Match</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍍</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pineapple: {
              400: '#facc15',
              500: '#eab308',
              600: '#ca8a04',
            },
            dark: {
              900: '#0a0a0a',
              800: '#121212',
              700: '#1a1a1a',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior: none; }
    .card {
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      will-change: transform;
      touch-action: none;
    }
    .card.swiping {
      transition: none;
    }
    .card.gone-left {
      transform: translateX(-150%) rotate(-30deg) !important;
      opacity: 0;
    }
    .card.gone-right {
      transform: translateX(150%) rotate(30deg) !important;
      opacity: 0;
    }
    .like-stamp, .nope-stamp {
      position: absolute;
      top: 40%;
      font-size: 3.5rem;
      font-weight: 800;
      padding: 0.4rem 1rem;
      border: 6px solid;
      border-radius: 12px;
      opacity: 0;
      transform: scale(0.5) rotate(-20deg);
      transition: all 0.2s;
      z-index: 20;
      pointer-events: none;
    }
    .like-stamp {
      right: 30px;
      color: #22c55e;
      border-color: #22c55e;
      transform: scale(0.5) rotate(20deg);
    }
    .nope-stamp {
      left: 30px;
      color: #ef4444;
      border-color: #ef4444;
    }
    .card.show-like .like-stamp { opacity: 1; transform: scale(1) rotate(20deg); }
    .card.show-nope .nope-stamp { opacity: 1; transform: scale(1) rotate(-20deg); }
    .match-overlay {
      animation: matchPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes matchPop {
      0% { transform: scale(0.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pulse-btn {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4); }
      50% { box-shadow: 0 0 0 12px rgba(234, 179, 8, 0); }
    }
  </style>
</head>
<body class="bg-dark-900 text-white font-sans min-h-screen overflow-hidden select-none">

  <!-- Splash / Onboarding -->
  <div id="splash" class="fixed inset-0 z-50 bg-dark-900 flex flex-col items-center justify-center px-6 transition-opacity duration-500">
    <div class="text-7xl mb-6">🍍</div>
    <h1 class="text-4xl font-extrabold tracking-tight mb-2">Mzinga Match</h1>
    <p class="text-gray-400 text-center text-lg mb-10 max-w-xs">Find someone nearby who's ready to share a mzinga</p>
    <button onclick="startApp()" class="bg-pineapple-500 hover:bg-pineapple-400 text-black font-bold text-lg px-10 py-4 rounded-full pulse-btn transition active:scale-95">
      Let's Go
    </button>
    <p class="absolute bottom-8 text-xs text-gray-600">Inspired by the viral post 🔥</p>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden flex flex-col h-screen max-w-md mx-auto relative">
    
    <!-- Header -->
    <header class="flex items-center justify-between px-5 py-4 z-10">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🍍</span>
        <span class="font-bold text-xl tracking-tight">Mzinga</span>
      </div>
      <div class="flex gap-3">
        <button class="w-10 h-10 rounded-full bg-dark-700 flex items-center justify-center text-lg">⚙️</button>
        <button onclick="showMatches()" class="w-10 h-10 rounded-full bg-dark-700 flex items-center justify-center text-lg relative">
          💬
          <span id="match-count" class="absolute -top-1 -right-1 bg-pineapple-500 text-black text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
        </button>
      </div>
    </header>

    <!-- Card Stack -->
    <div class="flex-1 relative px-4 pb-4">
      <div id="card-stack" class="relative w-full h-full max-h-[70vh]">
        <!-- Cards will be injected here -->
      </div>

      <!-- Empty state -->
      <div id="empty-state" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center px-8">
        <div class="text-6xl mb-4">🍻</div>
        <h2 class="text-2xl font-bold mb-2">No more people nearby</h2>
        <p class="text-gray-400 mb-6">Come back later or expand your radius</p>
        <button onclick="resetCards()" class="bg-dark-700 hover:bg-dark-600 px-6 py-3 rounded-full font-medium">Reload</button>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-center items-center gap-6 pb-10 pt-2">
      <button onclick="swipe('left')" class="w-16 h-16 rounded-full bg-dark-700 border-2 border-red-500/30 flex items-center justify-center text-2xl active:scale-90 transition shadow-lg">
        ✕
      </button>
      <button onclick="swipe('right')" class="w-20 h-20 rounded-full bg-pineapple-500 flex items-center justify-center text-3xl active:scale-90 transition shadow-lg shadow-pineapple-500/30">
        🍺
      </button>
      <button onclick="superLike()" class="w-16 h-16 rounded-full bg-dark-700 border-2 border-blue-500/30 flex items-center justify-center text-2xl active:scale-90 transition shadow-lg">
        ⭐
      </button>
    </div>
  </div>

  <!-- Match Modal -->
  <div id="match-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/90 backdrop-blur-sm">
    <div class="match-overlay text-center px-6">
      <div class="text-6xl mb-4">🎉</div>
      <h2 class="text-4xl font-extrabold text-pineapple-400 mb-2">It's a Match!</h2>
      <p class="text-xl text-gray-300 mb-6">You and <span id="match-name" class="font-bold text-white"></span> both want to share a mzinga</p>
      
      <div class="flex justify-center gap-4 mb-8">
        <div class="w-24 h-24 rounded-full bg-gradient-to-br from-pineapple-500 to-orange-600 flex items-center justify-center text-4xl border-4 border-white/20">👤</div>
        <div class="w-24 h-24 rounded-full bg-gradient-to-br from-purple-500 to-pink-600 flex items-center justify-center text-4xl border-4 border-white/20" id="match-avatar">👩</div>
      </div>

      <div class="space-y-3">
        <button onclick="sendMessage()" class="w-full max-w-xs bg-pineapple-500 hover:bg-pineapple-400 text-black font-bold py-4 rounded-full transition active:scale-95">
          Send a Message
        </button>
        <button onclick="closeMatch()" class="w-full max-w-xs bg-dark-700 hover:bg-dark-600 text-white font-medium py-3 rounded-full transition">
          Keep Swiping
        </button>
      </div>
    </div>
  </div>

  <!-- Matches Screen (simple) -->
  <div id="matches-screen" class="fixed inset-0 z-40 hidden bg-dark-900 flex flex-col">
    <div class="flex items-center justify-between px-5 py-4 border-b border-white/10">
      <button onclick="hideMatches()" class="text-2xl">←</button>
      <h2 class="font-bold text-lg">Your Matches</h2>
      <div class="w-8"></div>
    </div>
    <div id="matches-list" class="flex-1 overflow-y-auto p-4 space-y-3">
      <!-- matches injected -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
